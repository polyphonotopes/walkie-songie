[build]
# Output directory for build artifacts
dist = "dist"

[tools]
# Disable wasm-opt for faster dev builds
wasm_opt = "off"

[watch]
# Files to ignore during watch mode
ignore = ["dist", "target"]

# GitHub Pages deployment configuration
# Set public_url via CLI: trunk build --release --public-url /walkie-songie/
# Or override here for a specific deployment target
