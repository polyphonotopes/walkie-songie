[package]
name = "bare-music-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# THE point of this crate is its dependency list: the shared music protocol,
# HHHS Replica/repair seams, and NOTHING from walkie-songie.
[dependencies]
# This remains a separate, Walkie-free crate/process, but it must compile the
# same canonical music generation currently under interoperability test. When
# the root returns from the local Tutti candidate to a release tag, move these
# two dependencies back in the same change.
tutti-music = { path = "../../../tutti/tutti-music" }
tutti-music-hhhs = { path = "../../../tutti/tutti-music-hhhs" }
hhhs = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc" }
hhhs-proof = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc" }
hhhs-replica = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc" }
hhhs-store = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc" }
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc", features = ["driver"] }
