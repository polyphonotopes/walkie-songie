[package]
name = "walkie-songie-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Native Iroh desktop runtime for walkie-songie"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
iroh = { version = "=1.0.3" }
hhhs-core = { git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "bd23d4e9785f5d0b7bb458d148cab92d130b356e", features = ["wire"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "1.32", features = ["sync", "time"] }
walkie-songie = { path = "..", features = ["tauri-app"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
