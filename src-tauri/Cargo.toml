[package]
name = "walkie-songie-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Native Iroh desktop runtime for walkie-songie"

[package.metadata.cargo-machete]
# Used by build.rs; dependency scanners do not associate build-script symbols.
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
iroh = { version = "=1.0.3" }
hhhs-store = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-proof = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-sync = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4", features = ["driver"] }
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "1.32", features = ["sync", "time"] }
walkie-songie = { path = "..", features = ["tauri-app"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
