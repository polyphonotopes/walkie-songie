<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Songie</title>
    <meta name="description" content="P2P collaborative music application for real-time musical collaboration">
    <meta name="theme-color" content="#99bc66">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Walkie Songie">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script type="module" src="all-around-keyboard.esm.min.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
    <script type="module">
        import init, * as wasm from './walkie_songie.js';
        init('./walkie_songie_bg.wasm');
        window.wasmBindings = wasm;
    </script>
</body>
</html>
