<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2419"/>
      <stop offset="100%" style="stop-color:#2a3023"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#99bc66"/>
      <stop offset="100%" style="stop-color:#6da6ca"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6b374"/>
      <stop offset="100%" style="stop-color:#edc2bc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Sound waves -->
  <g fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round">
    <!-- Left waves -->
    <path d="M 100 200 Q 80 256 100 312" opacity="0.4"/>
    <path d="M 130 170 Q 100 256 130 342" opacity="0.6"/>
    <path d="M 160 140 Q 120 256 160 372" opacity="0.8"/>

    <!-- Right waves -->
    <path d="M 412 200 Q 432 256 412 312" opacity="0.4"/>
    <path d="M 382 170 Q 412 256 382 342" opacity="0.6"/>
    <path d="M 352 140 Q 392 256 352 372" opacity="0.8"/>
  </g>

  <!-- Musical note -->
  <g fill="url(#warm)">
    <!-- Note head -->
    <ellipse cx="230" cy="320" rx="40" ry="32" transform="rotate(-20 230 320)"/>
    <!-- Stem -->
    <rect x="262" y="160" width="12" height="165" rx="6"/>
    <!-- Flag -->
    <path d="M 274 160 Q 320 180 310 240 Q 290 210 274 200 Z"/>
  </g>

  <!-- Connection dots (P2P) -->
  <circle cx="256" cy="420" r="16" fill="url(#accent)" opacity="0.6"/>
  <circle cx="200" cy="440" r="10" fill="url(#accent)" opacity="0.4"/>
  <circle cx="312" cy="440" r="10" fill="url(#accent)" opacity="0.4"/>
  <line x1="210" y1="435" x2="245" y2="425" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  <line x1="267" y1="425" x2="302" y2="435" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
</svg>
