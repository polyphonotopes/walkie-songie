<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Songie — acceptance instrumentation</title>
    <meta name="description" content="Acceptance-only Walkie Songie browser artifact">
    <meta name="theme-color" content="#99bc66">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link data-trunk rel="css" href="assets/colors.css">
    <link data-trunk rel="css" href="assets/style.css">
    <link data-trunk rel="copy-file" href="assets/all-around-keyboard.esm.min.js">
    <link data-trunk rel="copy-file" href="assets/onnx-bridge.js">
    <link data-trunk rel="copy-file" href="assets/swiftf0.onnx">
    <link data-trunk rel="copy-file" href="assets/manifest.webmanifest">
    <link data-trunk rel="copy-file" href="assets/icon.svg">
    <link data-trunk rel="copy-file" href="assets/sw.js">
</head>
<body>
    <script type="module" src="all-around-keyboard.esm.min.js"></script>
    <script>
        // This target is never deployed. Service workers are still enabled so
        // the real terminate/reopen test exercises the same origin lifecycle.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
    <link data-trunk rel="rust" data-target-name="walkie_songie" data-wasm-opt="0" data-cargo-features="web-ui,browser-acceptance-faults" />
</body>
</html>
