<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Songie</title>
    <meta name="description" content="P2P collaborative music application for real-time musical collaboration">
    <meta name="theme-color" content="#99bc66">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Walkie Songie">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-primary,#1a1a2e);z-index:9999">
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#99bc66;border-radius:50%;animation:spin 1s linear infinite"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="all-around-keyboard.esm.min.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__ && !window.__TAURI__) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
    <script type="module">
        import init, * as wasm from './walkie_songie.js';
        await init();
        window.wasmBindings = wasm;
        document.getElementById('loading')?.remove();
    </script>
</body>
</html>
