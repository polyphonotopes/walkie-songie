[package]
name = "walkie-songie"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walkie-songie-plugin"
path = "src/plugin_main.rs"
required-features = ["plugin"]

[features]
default = ["plugin"]
plugin = ["dep:nih_plug", "dep:nih_plug_egui", "dep:crossbeam-channel", "dep:egui_extras", "dep:image"]
# Use Bevy iframe for graph visualization instead of cobwebs-visualizer CSS
bevy-graph = []

[workspace]
members = ["xtask"]

[dependencies]
# For MIDI input channel
async-channel = "2.3"

# Async
futures = "0.3"
async-broadcast = "0.7"  # Multi-consumer broadcast for event streams

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.16", features = ["v4", "rng-getrandom"] }
web-time = "1.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
rand = "0.9"
qrcode = "0.14"
unicode-segmentation = "1.11"

# CRDT
yrs = "0.21"

# Pitch detection: SwiftF0 ML model via onnxruntime-web JS bridge (no Rust ML deps needed)

# No build dependencies - palette.css is copied directly

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
tracing-subscriber = "0.3"

# libp2p for native (tcp + websocket)
libp2p = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication", features = ["dns", "ed25519", "gossipsub", "identify", "macros", "noise", "tcp", "tls", "tokio", "yamux", "websocket"] }

# Plugin dependencies (native only, feature-gated)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
egui_extras = { version = "0.30", optional = true, features = ["image"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.32", default-features = false, features = ["time", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# libp2p for browser (with browser-to-browser WebRTC)
libp2p = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication", features = ["ed25519", "gossipsub", "identify", "macros", "noise", "relay", "wasm-bindgen", "yamux"] }
libp2p-core = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication" }
libp2p-relay = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication" }
libp2p-swarm = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication" }
libp2p-webrtc-websys = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication" }
libp2p-websocket-websys = { git = "https://github.com/elijahhampton/rust-libp2p.git", branch = "feat(webrtc)-implement-webrtc-protocol-for-browser-to-browser-communication" }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Window", "Location", "console",
    "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement",
    "HtmlCollection", "DomTokenList", "NodeList",
    "AudioContext", "AudioContextState", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "MediaStreamAudioSourceNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioBuffer", "AudioNode", "AudioDestinationNode",
    "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url",
    "MessagePort", "MessageEvent", "EventTarget", "InputEvent",
    "MidiAccess", "MidiInput", "MidiInputMap", "MidiOutput", "MidiOutputMap", "MidiMessageEvent", "MidiOptions",
    "KeyboardEvent", "FocusEvent", "PointerEvent", "DomRect",
    "MutationObserver", "MutationObserverInit", "MutationRecord",
    "DragEvent", "DataTransfer",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "IdbOpenDbRequest"
] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["websocket"] }

# Polyphonotopes graph visualization (disable cozo feature for WASM compatibility)
polyphonotopes-rs = { path = "../polyphonotopes-2025/polyphonotopes-rs", default-features = false }

# Graph visualization custom element
cobwebs-visualizer = { path = "../cobwebs-visualizer" }

# Bevy-based graph visualization (direct integration)
musical-graphs-app = { path = "../polyphonotopes-2025/musical-graphs-app", default-features = false }

# UI framework
dominator = "0.5"
futures-signals = "0.3"

# Patch Bevy crates to use local checkout (required for musical-graphs-app integration)
[patch.crates-io]
bevy = { path = "../bevy" }
bevy_app = { path = "../bevy/crates/bevy_app" }
bevy_asset = { path = "../bevy/crates/bevy_asset" }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" }
bevy_window = { path = "../bevy/crates/bevy_window" }
bevy_utils = { path = "../bevy/crates/bevy_utils" }
bevy_log = { path = "../bevy/crates/bevy_log" }
bevy_math = { path = "../bevy/crates/bevy_math" }
bevy_platform = { path = "../bevy/crates/bevy_platform" }
bevy_render = { path = "../bevy/crates/bevy_render" }
bevy_core_pipeline = { path = "../bevy/crates/bevy_core_pipeline" }
bevy_pbr = { path = "../bevy/crates/bevy_pbr" }
bevy_sprite = { path = "../bevy/crates/bevy_sprite" }
bevy_text = { path = "../bevy/crates/bevy_text" }
bevy_gizmos = { path = "../bevy/crates/bevy_gizmos" }
bevy_scene = { path = "../bevy/crates/bevy_scene" }
bevy_reflect = { path = "../bevy/crates/bevy_reflect" }
bevy_input = { path = "../bevy/crates/bevy_input" }
bevy_color = { path = "../bevy/crates/bevy_color" }
bevy_image = { path = "../bevy/crates/bevy_image" }
bevy_time = { path = "../bevy/crates/bevy_time" }
bevy_transform = { path = "../bevy/crates/bevy_transform" }
bevy_input_focus = { path = "../bevy/crates/bevy_input_focus" }
bevy_winit = { path = "../bevy/crates/bevy_winit" }
bevy_picking = { path = "../bevy/crates/bevy_picking" }
