[package]
name = "walkie-songie"
version = "0.1.0"
edition = "2024"

[dependencies]
# P2P networking (versions from matchbox custom_signaller example)
iroh = { version = "0.35", default-features = false }
iroh-gossip = { version = "0.35", default-features = false, features = ["net"] }
matchbox_socket = "0.13"

# Async
futures = "0.3"
n0-future = "0.2"
async-broadcast = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.16", features = ["v4", "rng-getrandom"] }
web-time = "1.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
tracing-subscriber = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.32", default-features = false, features = ["time", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
