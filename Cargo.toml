[package]
name = "walkie-songie"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[package.metadata.cargo-machete]
# Feature-only dependency: enables getrandom's browser crypto backend for rand
# and uuid even though application source does not name the crate directly.
ignored = ["getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walkie-room-interop-probe"
path = "tests/support/room_v5_native_probe.rs"
required-features = ["interop-probe"]

[[bin]]
name = "tutti-walkie-songie-standalone"
path = "src/plugin_main.rs"
required-features = ["standalone"]

[features]
default = []
core = []
web-ui = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:tracing-wasm",
    "dep:js-sys",
    "dep:dominator",
    "browser-net",
]
# Browser (wasm) iroh transport: relay fallback + WebRTC custom direct carrier,
# iroh-gossip, and Router. The browser host carries Room-v5 Replica repair only.
# Enabled by `web-ui` so the plain-browser build (no Tauri) stands up a
# peer-to-peer room. The iroh crates are declared under the wasm target table
# below; native uses `native-net`.
# NOTE: `ring` (via iroh tls) needs a wasm-capable C compiler:
#   CC_wasm32_unknown_unknown=<unwrapped clang> AR_wasm32_unknown_unknown=llvm-ar
# The browser rendezvous WebSocket client (`net::rendezvous`) uses raw
# `web_sys::WebSocket` + wasm-bindgen closures, so pull those in here too — a
# `browser-net` build is inherently a wasm browser build. `web-ui` already
# enables the same crates, so real builds just union them.
browser-net = [
    "dep:iroh",
    "dep:iroh-gossip",
    "dep:iroh-tickets",
    "dep:n0-future",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    # WebRTC-as-an-iroh-custom-transport (M4 direct peering). `iroh-base` names
    # `CustomAddr`, `n0-watcher` names `Direct`/`Watchable` for `watch_local_addrs`,
    # and `noq-udp` names `RecvMeta` in `CustomEndpoint::poll_recv` — all three
    # appear in the iroh `CustomTransport` trait signatures, so the exact versions
    # iroh 1.0.3 resolves must be direct deps for the types to unify. `send_wrapper`
    # lets the `!Send` web-sys RTC handles satisfy the traits' `Send + Sync` bound
    # on single-threaded wasm. See `src/net/webrtc_transport.rs`.
    "dep:iroh-base",
    "dep:n0-watcher",
    "dep:noq-udp",
    "dep:send_wrapper",
]
# Acceptance-only availability fault injection. Ordinary `web-ui` artifacts
# must not compile this hook or its URL/query control surface.
browser-acceptance-faults = []
native-net = [
    "dep:iroh",
    "dep:iroh-base",
    "dep:iroh-gossip",
    "dep:iroh-mdns-address-lookup",
    "dep:iroh-tickets",
    # Native topic-rendezvous WebSocket client (`net::rendezvous`) talks the
    # y-webrtc signaling protocol over wss.
    "dep:tokio-tungstenite",
]
native-midi = ["dep:midir", "dep:wmidi"]
client-adapter = ["native-net"]
tauri-app = ["native-net", "native-midi"]
plugin = [
    "dep:egui",
    "dep:nice-plug",
    "dep:nice-plug-egui",
    "dep:tracing-subscriber",
    "native-net",
]
standalone = ["plugin", "nice-plug/standalone"]
# Developer-only independent-process interoperability harness. Keeping this
# separate prevents normal plugin bundles from linking a second native binary.
interop-probe = ["native-net"]
# Native BLE central used by the optional ESP bridge. The adapter and its
# asynchronous driver remain absent from ordinary browser/plugin builds.
desktop-ble = ["dep:btleplug"]

[workspace]
members = [
    "xtask",
    "src-tauri",
    "tests/bare-music-peer",
]
# tutti now lives at github.com/polyphonotopes/tutti and is consumed via git pin.
exclude = ["relay"]
resolver = "3"

[dependencies]
# For MIDI input channel
async-channel = "2.3"

# Async
futures = "0.3"
async-broadcast = "0.7"  # Multi-consumer broadcast for event streams

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.16", features = ["v4", "rng-getrandom"] }
web-time = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
rand = "0.9"
qrcode = "0.14"
unicode-segmentation = "1.11"
blake3 = "=1.8.5"
crossbeam-queue = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
# Iroh 1.0 and current UUID/futures-signals resolve getrandom 0.4 as a
# separate major. Keep its browser backend selected for the complete graph;
# these feature selections are harmless on native test targets.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# The music protocol (tutti Phase II): tuning identity (`crate::tuning` re-exports
# it), the MusicOp/MusicLang reference wire, the fold combinators `walkie_fold`
# drives, and the render seam. Wasm-safe.
tutti-music = { path = "../tutti/tutti-music" }
# Capability-native canonical-history adapter shared with independent music
# peers. It owns no Walkie extension or network runtime.
tutti-music-hhhs = { path = "../tutti/tutti-music-hhhs" }

# The reactive MIDI bridge: walkie's source-balanced ledger + input tracker
# (promoted; `src/midi` re-exports them) and the reconcile-on-reconnect core.
tutti-midi = { path = "../tutti/tutti-midi" }
# Experimental host/ESP interoperability waist. Keep this as a local path until
# the frozen GATT/session vectors have landed in a tagged Tutti release.
tutti-ble = { path = "../tutti/tutti-ble" }
tutti-session = { path = "../tutti/tutti-session" }
tutti-realtime = { path = "../tutti/tutti-realtime" }
tutti-roundtable = { path = "../tutti/tutti-roundtable" }
ed25519-dalek = "3"

# nice-plug powers the DAW shell only. BridgeCore itself has no plugin/UI
# dependency and can also be hosted by Tauri, a standalone process, or mobile.
nice-plug = { version = "0.3.0", optional = true, features = ["assert_process_allocs"] }
# Keep the mature OpenGL/baseview renderer on the plugin critical path.  The
# current egui-baseview WGPU backend unwraps surface creation and can terminate
# the entire standalone/DAW host on X11 configurations it cannot represent.
nice-plug-egui = { version = "0.4.0", optional = true, default-features = false, features = ["opengl"] }
egui = { version = "0.36.1", optional = true }

# Exact HHHS main candidate qualified as one dependency graph. The completed
# 1568b4f physical overlay remains the control; do not mix generations across crates.
hhhs = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063", features = ["driver"] }
hhhs-cap = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
hhhs-proof = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
hhhs-store = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
hhhs-replica = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
hhhs-session = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063", features = ["replica", "xchacha20poly1305"] }
# Browser placement protocol and in-process parity host. The actual Worker and
# IndexedDB handles remain wasm-only inside this crate, while its typed service
# seam is testable on native targets.
hhhs-web-browser = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "15fe3bd02af60ec609d4846953e2609d0e282063" }
ciborium = "0.2"
# futures-signals drives the HHHS reactive read model (room::mirror) on ALL targets
# (native plugin + wasm UI); dominator (wasm-only, below) consumes the same signals.
futures-signals = "0.3"
# Pitch detection: SwiftF0 ML model via onnxruntime-web JS bridge (no Rust ML deps needed)

# No build dependencies - palette.css is copied directly

[dev-dependencies]
# The walkie-free music peer for the lane-isolation gate
# (`tests/native_music_lane_e2e.rs`). Its OWN manifest must never name
# walkie-songie — that absence is what the gate proves.
bare-music-peer = { path = "tests/bare-music-peer" }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
futures = "0.3"
btleplug = { version = "=0.12.0", optional = true }

# Native transport: QUIC, relay-assisted hole punching, gossip, and room-scoped mDNS.
iroh = { version = "=1.0.3", optional = true }
iroh-base = { version = "=1.0.3", optional = true }
iroh-gossip = { version = "=0.101.0", optional = true }
iroh-mdns-address-lookup = { version = "=0.4.0", optional = true }
iroh-tickets = { version = "=1.0.0", optional = true }

# Native topic-rendezvous signaling client (y-webrtc protocol over wss). rustls
# via webpki roots reuses iroh's ring-backed rustls 0.23; no system-cert or
# native-tls dependency. Behind `native-net`.
tokio-tungstenite = { version = "0.27", features = [
    "connect",
    "rustls-tls-webpki-roots",
], optional = true }

# Native MIDI backend. Platform access stays behind `native-midi`.
midir = { version = "=0.11.0", optional = true }
wmidi = { version = "=4.0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.32", default-features = false, features = ["time", "sync", "macros", "io-util"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Browser iroh transport. `default-features = false` drops the
# native IP/portmapper/quinn stack; `tls-ring` supplies the QUIC crypto provider
# (ring compiles to wasm32 with clang as CC_wasm32_unknown_unknown). iroh 1.0.3
# gates its non-wasm deps out for `target_family = "wasm"`, so this links on
# wasm32-unknown-unknown. See `src/net/browser.rs`.
# `unstable-custom-transports` (empty feature — pure API-gating, pulls no native
# deps) unlocks `Endpoint::add_custom_transport` + the `CustomTransport` trait so
# the browser can carry iroh's QUIC over a WebRTC data channel and peer directly,
# off the relay (M4 direct-peering; docs/research/transport-agnostic-direct-peering-design.md).
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring", "unstable-custom-transports"], optional = true }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"], optional = true }
iroh-tickets = { version = "=1.0.0", optional = true }
# Runtime seams (spawn/sleep/timeout) that tokio provides on native: on wasm
# these map to spawn_local + setTimeout. Same version iroh itself uses.
n0-future = { version = "0.3", optional = true }

# WebRTC custom transport support crates. Pinned to what iroh 1.0.3 resolves so
# `CustomAddr`, `n0_watcher::Direct`/`Watchable`, and `noq_udp::RecvMeta` (all named
# in the `CustomTransport`/`CustomEndpoint`/`CustomSender` trait signatures) unify
# to iroh's own instances. `iroh-base` matches iroh's own feature selection.
iroh-base = { version = "=1.0.3", default-features = false, features = ["key", "relay"], optional = true }
n0-watcher = { version = "1.0", optional = true }
noq-udp = { version = "1.1", default-features = false, optional = true }
# Makes the `!Send` web-sys RTC handles (RtcPeerConnection/RtcDataChannel) satisfy
# the transport traits' `Send + Sync` bound; sound because wasm32 is single-threaded.
send_wrapper = { version = "0.6", optional = true }

gloo-timers = { version = "0.3", features = ["futures"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "WorkerGlobalScope", "Performance", "Location", "Storage", "console",
    "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement",
    "HtmlCollection", "DomTokenList", "NodeList",
    "AudioContext", "AudioContextState", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "MediaStreamAudioSourceNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioBuffer", "AudioNode", "AudioDestinationNode",
    "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url",
    "WebSocket",
    "MessagePort", "MessageEvent", "EventTarget", "InputEvent",
    "RtcPeerConnection", "RtcPeerConnectionState", "RtcPeerConnectionIceEvent",
    "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType", "RtcDataChannelEvent",
    "RtcConfiguration", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType",
    "RtcIceCandidate", "RtcIceCandidateInit", "RtcSignalingState",
    "MidiAccess", "MidiInput", "MidiInputMap", "MidiOutput", "MidiOutputMap", "MidiMessageEvent", "MidiOptions",
    "KeyboardEvent", "FocusEvent", "PointerEvent", "DomRect",
    "DragEvent", "DataTransfer",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "IdbOpenDbRequest"
] }
console_error_panic_hook = { version = "0.1", optional = true }
tracing-wasm = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# UI framework (wasm-only). futures-signals is declared once at the top level.
dominator = { version = "0.5", optional = true }

# Optimize WASM size for release builds
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

# Crypto hot paths run on every op (sign/verify + blake3 op-id/domain hashing) and
# are catastrophically slow at opt-level="z": ed25519 verify benchmarked ~4.75ms/op
# size-optimized (vs ~75us sign). These crates are tiny, so speed-optimizing just
# them costs little wasm bundle size while making verify ~50-95x faster on native
# AND in the shipped wasm. Specific-package profiles override the "*" glob above.
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
