[package]
name = "walkie-songie"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walkie-songie-plugin"
path = "src/plugin_main.rs"
required-features = ["plugin"]

[features]
default = []
core = []
web-ui = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:tracing-wasm",
    "dep:js-sys",
    "dep:dominator",
    "browser-net",
]
# Browser (wasm) iroh transport: relay-only Endpoint + iroh-gossip + Router,
# the `TransportMode::Iroh` variant compiled for wasm32 — the same ALPNs,
# tickets, and RBSR protocol as `native-net`, minus mDNS. Enabled by `web-ui`
# so the plain-browser build (no Tauri) stands up a peer-to-peer room. The iroh
# crates are declared under the wasm target table below; native uses `native-net`.
# NOTE: `ring` (via iroh tls) needs a wasm-capable C compiler:
#   CC_wasm32_unknown_unknown=<unwrapped clang> AR_wasm32_unknown_unknown=llvm-ar
# The browser rendezvous WebSocket client (`net::rendezvous`) uses raw
# `web_sys::WebSocket` + wasm-bindgen closures, so pull those in here too — a
# `browser-net` build is inherently a wasm browser build. `web-ui` already
# enables the same crates, so real builds just union them.
browser-net = [
    "dep:iroh",
    "dep:iroh-gossip",
    "dep:iroh-tickets",
    "dep:n0-future",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
]
native-net = [
    "dep:iroh",
    "dep:iroh-base",
    "dep:iroh-gossip",
    "dep:iroh-mdns-address-lookup",
    "dep:iroh-tickets",
    # Native topic-rendezvous WebSocket client (`net::rendezvous`) talks the
    # y-webrtc signaling protocol over wss.
    "dep:tokio-tungstenite",
]
native-midi = ["dep:midir", "dep:wmidi"]
client-adapter = ["native-net"]
tauri-app = ["native-net", "native-midi"]
plugin = ["dep:nih_plug", "dep:nih_plug_egui", "dep:crossbeam-channel", "dep:egui_extras", "dep:image"]
# Exposes `room::test_support` (Peer, oracle, entryhash_set) to the out-of-crate
# integration suite under `tests/`, which cannot see `#[cfg(test)]` items. The L0
# harness enables this: `cargo test --no-default-features --features test-support`.
test-support = []

[workspace]
members = ["xtask", "src-tauri"]
exclude = ["relay"]
resolver = "3"

[dependencies]
# For MIDI input channel
async-channel = "2.3"

# Async
futures = "0.3"
async-broadcast = "0.7"  # Multi-consumer broadcast for event streams

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.16", features = ["v4", "rng-getrandom"] }
web-time = "1.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
rand = "0.9"
qrcode = "0.14"
unicode-segmentation = "1.11"
blake3 = "=1.8.5"

# CRDT (legacy — being replaced by p2panda signed op-log + HHHS)
yrs = "0.21"

# P2P rewrite: signed operation log (p2panda-core) + HHHS causal read model.
# p2panda-core and HHHS are wasm-safe (no tokio/iroh); the native networking
# stack (p2panda-net) and browser iroh transport are added target-gated below.
p2panda-core = "0.7"
hhhs-core = { git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "bd23d4e9785f5d0b7bb458d148cab92d130b356e", features = ["wire"] }
hhhs-reactive = { git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "bd23d4e9785f5d0b7bb458d148cab92d130b356e" }
# futures-signals drives the HHHS reactive read model (room::mirror) on ALL targets
# (native plugin + wasm UI); dominator (wasm-only, below) consumes the same signals.
futures-signals = "0.3"

# Pitch detection: SwiftF0 ML model via onnxruntime-web JS bridge (no Rust ML deps needed)

# No build dependencies - palette.css is copied directly

# L0 integration-test harness (tests/). The self dev-dep forces the `test-support`
# feature on for the out-of-crate test crates (which cannot see `#[cfg(test)]`), and
# `hhhs-core` lets the reconcile driver name the RBSR reconciliation types directly.
[dev-dependencies]
walkie-songie = { path = ".", default-features = false, features = ["test-support"] }
hhhs-core = { git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "bd23d4e9785f5d0b7bb458d148cab92d130b356e" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
futures = "0.3"
tracing-subscriber = "0.3"

# Native transport: QUIC, relay-assisted hole punching, gossip, and room-scoped mDNS.
iroh = { version = "=1.0.3", optional = true }
iroh-base = { version = "=1.0.3", optional = true }
iroh-gossip = { version = "=0.101.0", optional = true }
iroh-mdns-address-lookup = { version = "=0.4.0", optional = true }
iroh-tickets = { version = "=1.0.0", optional = true }

# Native topic-rendezvous signaling client (y-webrtc protocol over wss). rustls
# via webpki roots reuses iroh's ring-backed rustls 0.23; no system-cert or
# native-tls dependency. Behind `native-net`.
tokio-tungstenite = { version = "0.27", features = [
    "connect",
    "rustls-tls-webpki-roots",
], optional = true }

# Native MIDI backend. Platform access stays behind `native-midi`.
midir = { version = "=0.11.0", optional = true }
wmidi = { version = "=4.0.11", optional = true }

# Plugin dependencies (native only, feature-gated)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
egui_extras = { version = "0.30", optional = true, features = ["image"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.32", default-features = false, features = ["time", "sync", "macros", "io-util"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Browser iroh transport (relay-only). `default-features = false` drops the
# native IP/portmapper/quinn stack; `tls-ring` supplies the QUIC crypto provider
# (ring compiles to wasm32 with clang as CC_wasm32_unknown_unknown). iroh 1.0.3
# gates its non-wasm deps out for `target_family = "wasm"`, so this links on
# wasm32-unknown-unknown. See `src/net/browser.rs`.
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"], optional = true }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"], optional = true }
iroh-tickets = { version = "=1.0.0", optional = true }
# Runtime seams (spawn/sleep/timeout) that tokio provides on native: on wasm
# these map to spawn_local + setTimeout. Same version iroh itself uses.
n0-future = { version = "0.3", optional = true }

gloo-timers = { version = "0.3", features = ["futures"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Location", "console",
    "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement",
    "HtmlCollection", "DomTokenList", "NodeList",
    "AudioContext", "AudioContextState", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "MediaStreamAudioSourceNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioBuffer", "AudioNode", "AudioDestinationNode",
    "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url",
    "WebSocket",
    "MessagePort", "MessageEvent", "EventTarget", "InputEvent",
    "MidiAccess", "MidiInput", "MidiInputMap", "MidiOutput", "MidiOutputMap", "MidiMessageEvent", "MidiOptions",
    "KeyboardEvent", "FocusEvent", "PointerEvent", "DomRect",
    "MutationObserver", "MutationObserverInit", "MutationRecord",
    "DragEvent", "DataTransfer",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "IdbOpenDbRequest"
] }
console_error_panic_hook = { version = "0.1", optional = true }
tracing-wasm = { version = "0.2", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { version = "0.3", optional = true }

# UI framework (wasm-only). futures-signals is declared once at the top level.
dominator = { version = "0.5", optional = true }

# Optimize WASM size for release builds
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
